<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forgot password - Acme Account</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Forgot password</h1>
      <p>Enter the email address on your account and we'll send you a reset link.</p>
      <form id="reset-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit" id="send-reset">Send reset link</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
      <div id="confirmation" class="confirmation" role="status" hidden>
        <h2>Check your inbox</h2>
        <p>If an account exists for <span id="sent-to"></span>, a reset link is on its way.</p>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
